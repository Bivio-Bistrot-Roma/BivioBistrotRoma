<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bivio Bistrot Roma</title>
  <meta name="theme-color" content="#FEE2B3">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="canonical" href="menu/">
  <!-- Segnaposto del sito del locale: finché non c'è, chi apre l'indirizzo principale va dritto al menu.
       Parametri e hash passano al menu (es. /?lang=en#vini -> /menu/?lang=en#vini).
       Da file:// una cartella non apre il suo index.html, quindi lì si punta al file. -->
  <script>
    location.replace((location.protocol === "file:" ? "menu/index.html" : "menu/") + location.search + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=menu/"></noscript>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FEE2B3; color: #731223; font-family: Georgia, serif; }
    a { color: inherit; }
  </style>
</head>
<body>
  <p><a href="menu/">Vai al menu del Bivio Bistrot</a></p>
</body>
</html>
